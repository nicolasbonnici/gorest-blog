name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: [ '**.md', 'LICENSE' ]
  push:
    branches: [main]
    paths-ignore: [ '**.md', 'LICENSE' ]
  schedule:
    # Nightly build verification.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.5'
  GOLANGCI_LINT_VERSION: 'v1.64.8'

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # Pinned and cached by the action rather than compiled from source at
      # @latest on every run.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # No database services: the suite runs entirely on in-memory SQLite. It never
  # reads POSTGRES_URL or MYSQL_URL, so starting PostgreSQL and MySQL here only
  # paid for two image pulls and two health-check waits per run.
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      # Not `make coverage`: that target's sibling `make clean` runs
      # `go clean -cache -testcache -modcache`, wiping the caches setup-go saves
      # in its post step and guaranteeing a cold build on the next run.
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

  # Nightly and on demand only. Every push to main used to rebuild a binary that
  # quality and test had already compiled.
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build verification
        run: make build
