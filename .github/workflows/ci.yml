name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Download dependencies
        run: go mod download

      - name: Install quality tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
          go install github.com/client9/misspell/cmd/misspell@latest
          go install github.com/kisielk/errcheck@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Run gofmt
        run: |
          echo "Checking code formatting with gofmt -s..."
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted correctly:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "All files are properly formatted"

      - name: Run go vet
        run: |
          echo "Running go vet..."
          go vet ./...

      - name: Run staticcheck
        run: |
          echo "Running staticcheck..."
          staticcheck ./...

      - name: Run ineffassign
        run: |
          echo "Checking for ineffectual assignments..."
          ineffassign ./...

      - name: Run misspell
        run: |
          echo "Checking for spelling mistakes..."
          misspell -error .

      - name: Run errcheck
        run: |
          echo "Checking for unchecked errors..."
          errcheck ./...

      - name: Run gocyclo
        run: |
          echo "Checking cyclomatic complexity (threshold: 15)..."
          gocyclo -over 15 . | grep -v '_test.go' | grep -v 'migrations/' || true
          RESULT=$(gocyclo -over 15 . | grep -v '_test.go' | grep -v 'migrations/')
          if [ -n "$RESULT" ]; then
            echo "Cyclomatic complexity too high in production code:"
            echo "$RESULT"
            exit 1
          fi
          echo "Production code complexity is acceptable"

      - name: Run golangci-lint
        run: |
          echo "Running golangci-lint comprehensive checks..."
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run

      - name: Cleanup
        if: always()
        run: go clean -cache -testcache -modcache

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          POSTGRES_URL: postgres://test:test@localhost:5432/test?sslmode=disable
          MYSQL_URL: test:test@tcp(localhost:3306)/test

      - name: Display coverage
        run: go tool cover -func=coverage.out

      - name: Cleanup
        if: always()
        run: |
          go clean -cache -testcache -modcache
          rm -f coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build verification
        run: go build -v ./...

      - name: Cleanup
        if: always()
        run: go clean -cache -testcache -modcache
